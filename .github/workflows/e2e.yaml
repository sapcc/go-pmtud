name: E2E Tests

"on":
  schedule:
    - cron: "0 2 * * *"  # Nightly at 02:00 UTC
  workflow_dispatch: {}
  pull_request:
    types: [labeled]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-backends:
    name: E2E Backend Tests
    timeout-minutes: 45
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          check-latest: true
          go-version: 1.26.2

      - name: Set up Kind and dependencies
        run: |
          # Install Kind
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

          # Install kubectl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl

          # Install docker (should be pre-installed on ubuntu-latest)
          docker version

      - name: Build go-pmtud binary
        run: go build -v -o build/go-pmtud ./cmd/go-pmtud

      - name: Build container image
        run: docker build -t go-pmtud:test .

      - name: Set up lab environment
        working-directory: lab
        run: |
          echo "Setting up Kind clusters and networks..."
          make pmtu-up

      - name: Deploy go-pmtud (UDP backend)
        working-directory: lab
        env:
          RELAY_BACKEND: udp
        run: |
          echo "Deploying go-pmtud with UDP backend..."
          bash scripts/deploy-pmtud.sh

      - name: Verify UDP backend pods
        run: |
          echo "Waiting for UDP backend pods to be ready..."
          kubectl wait --context kind-pmtud-cluster-a -n kube-system \
            --for=condition=ready pod \
            -l app.kubernetes.io/name=go-pmtud \
            --timeout=300s || exit 1

      - name: Run E2E test (UDP backend)
        working-directory: lab
        run: |
          echo "Running E2E test with UDP backend..."
          bash scripts/test-e2e.sh

      - name: Deploy go-pmtud (CRD backend)
        working-directory: lab
        env:
          RELAY_BACKEND: crd
        run: |
          echo "Deploying go-pmtud with CRD backend..."
          bash scripts/deploy-pmtud.sh

      - name: Verify CRD backend pods
        run: |
          echo "Waiting for CRD backend pods to be ready..."
          kubectl wait --context kind-pmtud-cluster-a -n kube-system \
            --for=condition=ready pod \
            -l app.kubernetes.io/name=go-pmtud \
            --timeout=300s || exit 1

      - name: Run E2E test (CRD backend)
        working-directory: lab
        run: |
          echo "Running E2E test with CRD backend..."
          bash scripts/test-e2e.sh

      - name: Verify relay backends loop
        working-directory: lab
        run: |
          echo "Running comprehensive backend test loop..."
          bash scripts/test-relay-backends.sh

      - name: Collect diagnostics on failure
        if: failure()
        working-directory: lab
        run: |
          echo "=== Lab Status ==="
          bash scripts/status.sh || true

          echo ""
          echo "=== Cluster-A Pods ==="
          kubectl --context kind-pmtud-cluster-a get pods -A || true

          echo ""
          echo "=== Cluster-B Pods ==="
          kubectl --context kind-pmtud-cluster-b get pods -A || true

          echo ""
          echo "=== CRDs ==="
          kubectl --context kind-pmtud-cluster-a get crd || true

      - name: Cleanup lab environment
        if: always()
        working-directory: lab
        run: |
          echo "Cleaning up lab..."
          make down || true
