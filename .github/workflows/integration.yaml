# Hand-maintained. NOT generated by go-makefile-maker (which has no
# integration-job concept). Edit this file directly.

name: Integration
"on":
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          check-latest: true
          go-version: 1.27.1
      - name: Install kind CLI
        run: go install sigs.k8s.io/kind@v0.32.0
      - name: Run integration suite
        run: make -C lab integration
