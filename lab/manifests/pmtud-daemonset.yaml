apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: go-pmtud
  labels:
    app.kubernetes.io/name: go-pmtud
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: go-pmtud
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-pmtud
    spec:
      serviceAccountName: go-pmtud
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      initContainers:
        - name: iptables-setup
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              apk add --no-cache iptables
              if [ "$(RELAY_BACKEND)" = "l2" ]; then
                # L2 backend: capture on the primary inter-node interface only.
                # In Kind (single eth0) replicated frames arrive on the same
                # interface, so peers relay back — that loop proves delivery.
                iptables -t raw -C PREROUTING -i eth0 -p icmp -m icmp --icmp-type 3/4 -j NFLOG --nflog-group 33 2>/dev/null || \
                iptables -t raw -A PREROUTING -i eth0 -p icmp -m icmp --icmp-type 3/4 -j NFLOG --nflog-group 33
              else
                # UDP backend: exclude the TUN device (pmtud0) to prevent
                # re-capture of injected packets.
                iptables -t raw -C PREROUTING -p icmp -m icmp --icmp-type 3/4 ! -i pmtud0 -j NFLOG --nflog-group 33 2>/dev/null || \
                iptables -t raw -A PREROUTING -p icmp -m icmp --icmp-type 3/4 ! -i pmtud0 -j NFLOG --nflog-group 33
              fi
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
      containers:
        - name: go-pmtud
          image: go-pmtud:local
          imagePullPolicy: Never
          command:
            - /go-pmtud
          args:
            - --nflog_group=33
            - --nodename=$(NODE_NAME)
            - --relay-backend=$(RELAY_BACKEND)
            - --iface_names=eth0
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: RELAY_BACKEND
              value: "$(RELAY_BACKEND)"
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
