apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: go-pmtud
  labels:
    app.kubernetes.io/name: go-pmtud
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: go-pmtud
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-pmtud
    spec:
      serviceAccountName: go-pmtud
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: go-pmtud
          image: go-pmtud:local
          imagePullPolicy: Never
          command:
            - /go-pmtud
          args:
            - --nflog_group=33
            - --nodename=$(NODE_NAME)
            - --relay-backend=$(RELAY_BACKEND)
            - --iface_names=eth0
            - --iface_mtu=$(IFACE_MTU)
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: RELAY_BACKEND
              value: "$(RELAY_BACKEND)"
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
